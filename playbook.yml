---
- name: Laboratorio Ansible con servidores Docker
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Nombre del host: {{ inventory_hostname }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: Crear el directorio /tmp/ansible-demo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: "0755"

    - name: Crear el archivo info.txt
      ansible.builtin.file:
        path: /tmp/ansible-demo/info.txt
        state: touch
        mode: "0644"

    - name: Escribir nombre del servidor y sistema operativo en info.txt
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
        mode: "0644"

    - name: Crear los directorios logs, backup y config
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje solo si el sistema operativo es Ubuntu
      ansible.builtin.debug:
        msg: "Este servidor ({{ inventory_hostname }}) usa Ubuntu"
      when: ansible_facts['distribution'] == "Ubuntu"
